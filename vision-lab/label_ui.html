<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene Labels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0d0f; --surface: #141518; --raised: #1b1c20; --line: #26282e; --line-strong: #383b43;
  --text: #ececef; --muted: #8e9099; --faint: #5d6069;
  --idle: #7d8494; --tease: #e0a03a; --nude: #ec6d8c; --explicit: #b45cf0; --unsure: #4d94e6;
  --focus: #ffffff;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; }
body { min-height: 100vh; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
kbd { font: 600 11px/1 ui-monospace, monospace; padding: 3px 5px; border-radius: 4px; background: #2a2c33; color: #c9cbd2; }

/* top bar */
.top { display: flex; align-items: center; gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; letter-spacing: .01em; }
.brand span { color: var(--muted); font-weight: 500; }
.picker { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); }
.picker:hover { border-color: var(--line-strong); }
.picker b { font-weight: 600; }
.picker .when { color: var(--muted); }
.spacer { flex: 1; }
.overall { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.overall .meter { width: 160px; height: 6px; border-radius: 3px; background: var(--line); display: flex; overflow: hidden; }
.overall .meter span { height: 100%; }
.demo-badge { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tease); border: 1px solid currentColor; border-radius: 4px; padding: 2px 6px; }

/* recording timeline */
.wrap { width: 100%; max-width: 1480px; margin: 0 auto; padding: 0 28px; }
.timeline-block { padding-top: 18px; padding-bottom: 6px; }
.timeline-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.timeline { display: flex; gap: 2px; height: 30px; }
.seg { position: relative; min-width: 3px; border-radius: 3px; background: var(--raised); cursor: pointer; transition: transform .12s, opacity .12s; }
.seg.unlabeled { background: repeating-linear-gradient(135deg, #22242a 0 5px, #1a1b20 5px 10px); }
.seg:hover { opacity: .85; }
.seg.current { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--focus); z-index: 1; }
.seg.flash { animation: flash .5s; }
@keyframes flash { 0% { transform: scaleY(1.5); } 100% { transform: none; } }
.hovercard { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px; display: none; box-shadow: 0 12px 32px rgba(0,0,0,.5); }
.hovercard img { width: 240px; display: block; border-radius: 4px; aspect-ratio: 16/9; object-fit: cover; }
.hovercard div { font-size: 12px; color: var(--muted); padding: 4px 2px 0; }

/* scene */
.scene { padding-top: 18px; }
.scene-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
.scene-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
.scene-head .range { color: var(--muted); font-variant-numeric: tabular-nums; }
.scene-head .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--raised); }
.nav { display: flex; gap: 6px; }
.nav button { padding: 6px 10px; border-radius: 6px; color: var(--muted); border: 1px solid var(--line); display: inline-flex; gap: 8px; align-items: center; }
.nav button:hover:not(:disabled) { color: var(--text); border-color: var(--line-strong); }
.nav button:disabled { opacity: .35; cursor: default; }
.frames { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.frames.split { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; }
.frame { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--surface); cursor: zoom-in; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame .t { position: absolute; left: 8px; bottom: 7px; font: 600 11px ui-monospace, monospace; color: #fff; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 4px; }
.frames.split .frame { cursor: pointer; border-radius: 6px; }
.frames.split .frame::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: transparent; z-index: 1; }
.frames.split .frame:hover::before { background: var(--focus); }
.frames.split .frame:hover::after { content: "Cut here"; position: absolute; left: 10px; top: 8px; font-size: 11px; font-weight: 700; color: #000; background: var(--focus); padding: 2px 7px; border-radius: 4px; }
.frames.split .frame:first-child { cursor: default; opacity: .7; }
.frames.split .frame:first-child:hover::before, .frames.split .frame:first-child:hover::after { display: none; }
.hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; }

/* done */
.done { text-align: center; padding: 80px 0; }
.done h2 { font-size: 24px; margin: 0 0 6px; }
.done p { color: var(--muted); margin: 0 0 24px; }
.primary { background: var(--text); color: #000; font-weight: 600; padding: 10px 18px; border-radius: 8px; }

/* label dock */
.dock { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 22px); padding: 22px 0 20px; z-index: 5; }
main { flex: 1; }
.dock .wrap { display: flex; gap: 10px; align-items: stretch; }
.lab { flex: 1; text-align: left; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; transition: border-color .1s, background .1s; }
.lab:hover { border-color: var(--line-strong); background: var(--raised); }
.lab .name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.lab .name kbd { margin-left: auto; }
.lab .dot { width: 12px; height: 12px; border-radius: 4px; }
.lab .def { color: var(--muted); font-size: 12px; line-height: 1.35; }
.lab.active { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.lab.small { flex: 0 0 150px; }
.tool { flex: 0 0 150px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; display: none; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 380px; background: var(--surface); border-right: 1px solid var(--line); z-index: 31; transform: translateX(-100%); transition: transform .18s; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer.open + .scrim, .scrim.show { display: block; }
.drawer header { padding: 18px 20px 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.drawer .list { overflow-y: auto; flex: 1; padding: 0 10px 20px; }
.rec { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; }
.rec:hover { background: var(--raised); }
.rec.active { background: var(--raised); box-shadow: inset 3px 0 var(--text); }
.rec .row { display: flex; justify-content: space-between; gap: 10px; }
.rec .row span:last-child { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.rec .bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 7px; overflow: hidden; }
.rec .bar span { display: block; height: 100%; background: var(--text); }
.rec.complete .bar span { background: #5fc78a; }

/* mode tabs */
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
.tabs button { padding: 5px 12px; border-radius: 6px; color: var(--muted); font-weight: 500; display: inline-flex; gap: 7px; align-items: center; }
.tabs button.on { background: var(--raised); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }
.tabs .count { font-size: 11px; font-weight: 700; background: #2a2c33; color: var(--text); padding: 1px 6px; border-radius: 99px; font-variant-numeric: tabular-nums; }

/* review */
.vs { display: flex; align-items: center; gap: 14px; margin: 4px 0 16px; font-size: 15px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; font-weight: 600; background: color-mix(in srgb, var(--c) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.pill .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.vs .who { color: var(--muted); font-size: 13px; }
.vs .arrow { color: var(--faint); }
.conf { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.explain { color: var(--muted); font-size: 13px; max-width: 900px; margin: 0 0 14px; }
.model-status { color: var(--faint); font-size: 12px; }
.empty { text-align: center; padding: 90px 0; color: var(--muted); }
.empty h2 { color: var(--text); font-size: 22px; margin: 0 0 6px; }
.lab.keep { flex: 1.3; }
.lab .def b { color: var(--text); font-weight: 600; }

/* "is reviewing still paying off?" */
.payoff { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); margin-top: 16px; flex-wrap: wrap; }
.payoff.stop { border-color: color-mix(in srgb, #5fc78a 55%, transparent); background: color-mix(in srgb, #5fc78a 10%, var(--surface)); }
.payoff .q { font-weight: 600; }
.payoff .dots { display: flex; gap: 4px; }
.payoff .dots span { width: 14px; height: 14px; border-radius: 4px; background: var(--line); }
.payoff .dots span.changed { background: var(--tease); }
.payoff .dots span.kept { background: #3a3d45; box-shadow: inset 0 0 0 1px var(--line-strong); }
.payoff .text { color: var(--muted); font-size: 13px; flex: 1; min-width: 260px; }
.payoff .text b { color: var(--text); }
.payoff .legend { color: var(--faint); font-size: 12px; display: flex; gap: 12px; }
.payoff .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* suggestions */
.section { padding: 6px 12px 4px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.reasons { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
.reason { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.reason::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 2px; background: var(--c, var(--faint)); transform: translateY(-1px); }
.reason.weak { --c: var(--nude); } .reason.single { --c: var(--tease); } .reason.unfinished { --c: var(--unsure); } .reason.new { --c: #5fc78a; }

/* lightbox */
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.lightbox.show { display: flex; }
.lightbox img { width: min(92vw, 78vh * 16 / 9); aspect-ratio: 16 / 9; object-fit: contain; border-radius: 8px; image-rendering: auto; }
.lightbox div { color: var(--muted); font-variant-numeric: tabular-nums; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #4a1f24; color: #ffd3d8; padding: 8px 14px; border-radius: 8px; display: none; z-index: 50; }
</style>
</head>
<body>
<div class="top">
  <div class="brand">Scene labels <span>· highlight training data</span></div>
  <button class="picker" id="picker" title="All recordings (R)"><b id="pChannel">—</b><span class="when" id="pWhen"></span><span class="when">▾</span></button>
  <span id="demo"></span>
  <div class="tabs"><button id="tabLabel" class="on">Label</button><button id="tabReview">Review <span class="count" id="reviewCount">…</span></button></div>
  <div class="spacer"></div>
  <div class="overall"><div class="meter" id="meter"></div><span id="overall"></span></div>
  <button class="picker" id="exportBtn" title="Train on every label and use it for Kura's highlights"><b>Send model to Kura</b><span class="when" id="exportInfo"></span></button>
</div>

<div class="wrap timeline-block" id="tlBlock">
  <div class="timeline-head"><span id="tlLeft"></span><span id="tlRight"></span></div>
  <div class="timeline" id="timeline"></div>
</div>

<main>
<div class="wrap scene" id="scene"></div>
<div class="wrap scene" id="review" hidden></div>
<div class="dock"><div class="wrap" id="dock"></div></div>
</main>

<aside class="drawer" id="drawer"><header>Recordings <kbd>R</kbd></header><div class="list" id="list"></div></aside>
<div class="scrim" id="scrim"></div>
<div class="lightbox" id="lightbox"><img id="lbImg" alt=""><div id="lbText"></div></div>
<div class="hovercard" id="hovercard"><img alt=""><div></div></div>
<div class="toast" id="toast"></div>

<script>
const LABELS = [
  { id: "idle", key: "1", name: "Idle", def: "Clothed, chatting, empty room, offline card" },
  { id: "tease", key: "2", name: "Tease", def: "Lingerie, posing, undressing, toy play while clothed — still covered" },
  { id: "nude", key: "3", name: "Nude", def: "Nipples or genitals visible (also through fabric), no sexual activity" },
  { id: "explicit", key: "4", name: "Explicit", def: "Sexual activity with nudity visible: masturbation, toys, sex" },
  { id: "unsure", key: "5", name: "Unsure", def: "Can't tell — left out of training" },
];
const BY_ID = Object.fromEntries(LABELS.map(l => [l.id, l]));
const BY_KEY = Object.fromEntries(LABELS.map(l => [l.key, l.id]));
const SAMPLE = 8;
const $ = id => document.getElementById(id);

let recs = [], byLabel = {}, rec = null, scenes = [], labels = {}, cur = 0, splitting = false, lightbox = null;
let lightboxVid = null, mode = "label", suggestions = [], review = { items: [], total: 0, index: 0, model: null, loaded: false };

const fmt = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? `${h}:${String(m).padStart(2, "0")}` : m) + ":" + String(x).padStart(2, "0"); };
const dur = s => s < 60 ? `${Math.round(s)}s` : `${Math.floor(s / 60)}m ${String(Math.round(s % 60)).padStart(2, "0")}s`;
const when = name => { const m = name.match(/(\d{4})-(\d\d)-(\d\d)_(\d\d)-(\d\d)/);
  return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : ""; };
const frameUrl = (i, id = rec.id) => `/frame/${id}/${i}.jpg`;
const sceneLabel = s => { const first = labels[s[0]]; for (let i = s[0]; i <= s[1]; i++) if (labels[i] !== first) return null; return first || null; };
const toast = (msg, tone) => { const t = $("toast"); t.textContent = msg; t.style.display = "block"; t.style.background = tone === "ok" ? "#1f3a2a" : ""; t.style.color = tone === "ok" ? "#cdf3da" : ""; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4000); };

async function loadList() {
  const data = await (await fetch("/api/recordings")).json();
  recs = data.recordings; byLabel = data.by_label;
  $("demo").innerHTML = data.demo ? '<span class="demo-badge">Demo data</span>' : "";
  renderOverall(); renderList();
}
function renderOverall() {
  const frames = recs.reduce((a, r) => a + r.count, 0);
  const done = Object.values(byLabel).reduce((a, b) => a + b, 0);
  $("meter").innerHTML = LABELS.map(l => `<span style="width:${100 * (byLabel[l.id] || 0) / frames}%;background:var(--${l.id})"></span>`).join("");
  const recsDone = recs.filter(r => r.labeled >= r.count).length;
  $("overall").textContent = `${recsDone} of ${recs.length} recordings · ${done.toLocaleString()} frames`;
  renderExportInfo();
}
function recRow(r, reasons) {
  const pct = Math.min(100, Math.round(100 * r.labeled / r.count));
  return `<button class="rec ${rec && rec.id === r.id ? "active" : ""} ${pct === 100 ? "complete" : ""}" data-id="${r.id}">
    <div class="row"><span>${r.channel}</span><span>${pct === 100 ? "done" : pct ? pct + "%" : fmt(r.duration)}</span></div>
    <div class="row"><span class="when" style="color:var(--muted);font-size:12px">${when(r.file_name)}</span></div>
    ${reasons ? `<div class="reasons">${reasons.map(x => `<span class="reason ${x.kind}">${x.text}</span>`).join("")}</div>` : ""}
    <div class="bar"><span style="width:${pct}%"></span></div></button>`;
}
async function loadSuggestions() {
  try { suggestions = (await (await fetch("/api/suggestions")).json()).items; } catch { suggestions = []; }
  renderList();
}
function renderList() {
  const byId = Object.fromEntries(recs.map(r => [r.id, r]));
  const picks = suggestions.filter(x => byId[x.video_id] && byId[x.video_id].labeled < byId[x.video_id].count);
  $("list").innerHTML = (picks.length ? `<div class="section">Worth labelling next</div>`
      + picks.map(x => recRow(byId[x.video_id], x.reasons)).join("") + `<div class="section" style="margin-top:12px">All recordings</div>` : "")
    + recs.map(r => recRow(r)).join("");
}
async function open(id) {
  rec = await (await fetch("/api/recordings/" + id)).json();
  scenes = rec.scenes; labels = rec.labels; splitting = false;
  cur = Math.max(0, scenes.findIndex(s => !sceneLabel(s)));
  $("pChannel").textContent = rec.channel; $("pWhen").textContent = when(rec.file_name);
  try { localStorage.setItem("lastRec", id); } catch {}
  closeDrawer(); renderList();
  if (mode === "label") render();
}

function render() { renderTimeline(); renderScene(); renderDock(); preload(); }

function renderTimeline() {
  const labelled = scenes.filter(sceneLabel).length;
  $("tlLeft").textContent = `${labelled} of ${scenes.length} scenes labelled`;
  $("tlRight").textContent = `${fmt(rec.duration)} · ${rec.count} frames`;
  $("timeline").innerHTML = scenes.map((s, k) => {
    const l = sceneLabel(s);
    return `<div class="seg ${l ? "" : "unlabeled"} ${k === cur ? "current" : ""}" data-k="${k}"
      style="flex:${s[1] - s[0] + 1};${l ? `background:var(--${l})` : ""}"></div>`;
  }).join("");
}

function sampleFrames(s) {
  const n = s[1] - s[0] + 1;
  if (n <= SAMPLE) return Array.from({ length: n }, (_, i) => s[0] + i);
  return Array.from({ length: SAMPLE }, (_, i) => s[0] + Math.round(i * (n - 1) / (SAMPLE - 1)));
}

function renderScene() {
  const el = $("scene");
  if (cur >= scenes.length) {
    const suggested = suggestions.map(x => recs.find(r => r.id === x.video_id)).find(r => r && r.id !== rec.id && r.labeled < r.count);
    const next = suggested || recs.find(r => r.id !== rec.id && r.labeled < r.count);
    el.innerHTML = `<div class="done"><h2>Recording labelled</h2>
      <p>${scenes.length} scenes, ${rec.count} frames. Go back to any scene from the timeline to change it.</p>
      ${next ? `<button class="primary" id="nextRec">Next: ${next.channel} · ${when(next.file_name)} &nbsp;<kbd>Enter</kbd></button>` : "<p>Every recording is labelled.</p>"}</div>`;
    if (next) $("nextRec").onclick = () => open(next.id);
    return;
  }
  const s = scenes[cur], l = sceneLabel(s), n = s[1] - s[0] + 1;
  const frames = splitting ? Array.from({ length: n }, (_, i) => s[0] + i) : sampleFrames(s);
  const chip = l ? `<span class="chip" style="color:var(--${l})"><span class="dot" style="width:8px;height:8px;border-radius:3px;background:var(--${l})"></span>${BY_ID[l].name}</span>`
    : (labels[s[0]] || labels[s[1]]) ? `<span class="chip">Mixed</span>` : "";
  el.innerHTML = `
    <div class="scene-head">
      <h2>Scene ${cur + 1} <span style="color:var(--faint);font-weight:500">/ ${scenes.length}</span></h2>
      <span class="range">${fmt(s[0] * rec.interval)} – ${fmt((s[1] + 1) * rec.interval)} · ${dur(n * rec.interval)}${n > SAMPLE && !splitting ? ` · showing ${SAMPLE} of ${n} frames` : ""}</span>
      ${chip}
      <span class="spacer"></span>
      <div class="nav"><button id="prev" ${cur === 0 ? "disabled" : ""}><kbd>←</kbd> Previous</button>
      <button id="next">Next <kbd>→</kbd></button></div>
    </div>
    <div class="frames ${splitting ? "split" : ""}" style="${splitting ? "" : `grid-template-columns:repeat(${Math.min(4, frames.length)}, 1fr);max-width:${frames.length < 3 ? frames.length * 34 : 100}%`}">${frames.map(i =>
      `<div class="frame" data-i="${i}"><img src="${frameUrl(i)}" alt="" loading="eager"><span class="t">${fmt(i * rec.interval)}</span></div>`).join("")}</div>
    <p class="hint">${splitting
      ? "Click the first frame of the new part to cut the scene there. <kbd>S</kbd> or <kbd>Esc</kbd> to stop splitting."
      : "Does the whole scene share one label? Press its key. If it changes partway, press <kbd>S</kbd> to split it. Click a frame to see it large."}</p>`;
  $("prev").onclick = () => go(cur - 1);
  $("next").onclick = () => go(cur + 1);
}

function renderDock() {
  const s = scenes[cur], l = s && sceneLabel(s);
  if (!s) { $("dock").innerHTML = ""; return; }
  $("dock").innerHTML = LABELS.map(x => `<button class="lab ${x.id === "unsure" ? "small" : ""} ${l === x.id ? "active" : ""}" style="--c:var(--${x.id})" data-l="${x.id}">
      <span class="name"><span class="dot" style="background:var(--${x.id})"></span>${x.name}<kbd>${x.key}</kbd></span>
      <span class="def">${x.def}</span></button>`).join("")
    + `<button class="lab tool ${splitting ? "active" : ""}" style="--c:var(--focus)" id="splitBtn" ${!s || s[0] === s[1] ? "disabled" : ""}>
      <span class="name">Split<kbd>S</kbd></span><span class="def">Scene changes partway</span></button>`;
  $("dock").querySelectorAll("[data-l]").forEach(b => b.onclick = () => apply(b.dataset.l));
  $("splitBtn").onclick = toggleSplit;
}

function preload() {
  for (const s of scenes) new Image().src = frameUrl(Math.floor((s[0] + s[1]) / 2));
  for (const s of scenes.slice(cur + 1, cur + 3)) for (const i of sampleFrames(s)) new Image().src = frameUrl(i);
}

function go(k) { cur = Math.max(0, Math.min(scenes.length, k)); splitting = false; render(); scrollTo({ top: 0 }); }

async function apply(label) {
  const s = scenes[cur]; if (!s) return;
  const frames = []; for (let i = s[0]; i <= s[1]; i++) frames.push(i);
  const before = frames.map(i => labels[i]);
  frames.forEach(i => labels[i] = label);
  const k = cur;
  // Next scene still unlabelled after this one, else the end.
  let next = scenes.findIndex((x, j) => j > cur && !sceneLabel(x));
  go(next === -1 ? scenes.length : next);
  $("timeline").children[k]?.classList.add("flash");
  try {
    const r = await fetch("/api/labels", { method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify({ video_id: rec.id, frames, label }) });
    if (!r.ok) throw new Error(r.status);
    const entry = recs.find(x => x.id === rec.id);
    const newly = before.filter(b => !b).length;
    entry.labeled += newly;
    before.forEach(b => { if (b) byLabel[b]--; }); byLabel[label] = (byLabel[label] || 0) + frames.length;
    renderOverall(); renderList();
  } catch (e) {
    frames.forEach((i, j) => before[j] ? labels[i] = before[j] : delete labels[i]);
    cur = k; render(); toast("Couldn't save that label — is the label server still running?");
  }
}

function toggleSplit() { const s = scenes[cur]; if (!s || s[0] === s[1]) return; splitting = !splitting; renderScene(); renderDock(); }
function cutAt(i) {
  const s = scenes[cur]; if (i <= s[0] || i > s[1]) return;
  scenes.splice(cur, 1, [s[0], i - 1], [i, s[1]]);
  splitting = false; render();
}

function showLightbox(i, vid = lightboxVid ?? rec.id) {
  const r = recs.find(x => x.id === vid); lightbox = i; lightboxVid = vid;
  $("lbImg").src = frameUrl(i, vid);
  const l = vid === rec?.id ? labels[i] : null;
  $("lbText").textContent = `${r.channel} · ${fmt(i * 5)} · frame ${i + 1} of ${r.count}${l ? " · " + BY_ID[l].name : ""} · ← → step · Esc close`;
  $("lightbox").classList.add("show");
}
function hideLightbox() { lightbox = null; lightboxVid = null; $("lightbox").classList.remove("show"); }

function openDrawer() { loadSuggestions(); $("drawer").classList.add("open"); $("scrim").classList.add("show"); $("drawer").querySelector(".active")?.scrollIntoView({ block: "center" }); }
function closeDrawer() { $("drawer").classList.remove("open"); $("scrim").classList.remove("show"); }

$("picker").onclick = openDrawer;
$("scrim").onclick = closeDrawer;
$("list").onclick = e => { const b = e.target.closest(".rec"); if (b) open(+b.dataset.id); };
$("lightbox").onclick = hideLightbox;
$("scene").onclick = e => {
  const f = e.target.closest(".frame"); if (!f) return;
  splitting ? cutAt(+f.dataset.i) : showLightbox(+f.dataset.i, rec.id);
};
$("review").onclick = e => {
  const f = e.target.closest(".frame"); if (f) showLightbox(+f.dataset.i, +f.dataset.v);
};
$("timeline").onclick = e => { const s = e.target.closest(".seg"); if (s) go(+s.dataset.k); };
$("timeline").onmousemove = e => {
  const seg = e.target.closest(".seg"), card = $("hovercard");
  if (!seg) { card.style.display = "none"; return; }
  const s = scenes[+seg.dataset.k], mid = Math.floor((s[0] + s[1]) / 2), l = sceneLabel(s);
  card.querySelector("img").src = frameUrl(mid);
  card.querySelector("div").textContent = `Scene ${+seg.dataset.k + 1} · ${fmt(s[0] * rec.interval)} · ${l ? BY_ID[l].name : "unlabelled"}`;
  card.style.display = "block";
  card.style.left = Math.min(innerWidth - 270, Math.max(10, e.clientX - 126)) + "px";
  card.style.top = (seg.getBoundingClientRect().bottom + 10) + "px";
};
$("timeline").onmouseleave = () => $("hovercard").style.display = "none";

addEventListener("keydown", e => {
  if (!rec || e.ctrlKey || e.metaKey || e.altKey) return;
  if (lightbox !== null) {
    const count = recs.find(x => x.id === lightboxVid).count;
    if (e.key === "Escape") hideLightbox();
    if (e.key === "ArrowRight") showLightbox(Math.min(count - 1, lightbox + 1));
    if (e.key === "ArrowLeft") showLightbox(Math.max(0, lightbox - 1));
    e.preventDefault(); return;
  }
  if ($("drawer").classList.contains("open")) { if (e.key === "Escape" || e.key === "r") closeDrawer(); return; }
  if (e.key === "Tab") { setMode(mode === "label" ? "review" : "label"); e.preventDefault(); return; }
  if (mode === "review") { reviewKey(e); return; }
  if (BY_KEY[e.key] && cur < scenes.length) apply(BY_KEY[e.key]);
  else if (e.key === "ArrowRight" || e.key === "l") go(cur + 1);
  else if (e.key === "ArrowLeft" || e.key === "h") go(cur - 1);
  else if (e.key === "s") toggleSplit();
  else if (e.key === "Escape" && splitting) toggleSplit();
  else if (e.key === "r") openDrawer();
  else if (e.key === "Enter" && cur >= scenes.length) $("nextRec")?.click();
  else return;
  e.preventDefault();
});

// ---------- review: where the held-out model disagrees with the stored label ----------
async function loadReview() {
  const data = await (await fetch("/api/review")).json();
  review = { ...review, items: data.items, total: data.total, model: data.model, index: 0, loaded: true };
  $("reviewCount").textContent = data.model.ready ? data.total : "…";
  if (mode === "review") renderReview();
  if (!data.model.ready) setTimeout(loadReview, 4000);
}
const pill = (l, extra = "") => `<span class="pill" style="--c:var(--${l})"><span class="dot"></span>${BY_ID[l].name}${extra}</span>`;
function sampleOf(list) {
  if (list.length <= SAMPLE) return list;
  return Array.from({ length: SAMPLE }, (_, i) => list[Math.round(i * (list.length - 1) / (SAMPLE - 1))]);
}
function modelLine() {
  const m = review.model; if (!m?.ready) return "";
  return `Model trained on ${m.labelled_frames.toLocaleString()} labelled frames${m.training ? " · retraining with your latest labels…" : ""}`;
}
function renderReview() {
  const el = $("review"), it = review.items[review.index];
  if (!review.model?.ready) {
    el.innerHTML = `<div class="empty"><h2>Training on your labels…</h2><p>About a minute. This page updates by itself.</p></div>`;
    $("dock").innerHTML = ""; return;
  }
  if (!it) {
    el.innerHTML = `<div class="empty"><h2>Nothing left to review</h2><p>${modelLine()}</p>
      <button class="primary" id="refreshReview">Check again with the retrained model</button></div>`;
    $("refreshReview").onclick = () => { review.model = { ...review.model, ready: false }; renderReview(); loadReview(); };
    $("dock").innerHTML = ""; return;
  }
  const r = recs.find(x => x.id === it.video_id), n = it.end - it.start + 1;
  el.innerHTML = `
    <div class="scene-head">
      <h2>Disagreement ${review.index + 1} <span style="color:var(--faint);font-weight:500">/ ${review.items.length}</span></h2>
      <span class="range">${it.channel} · ${when(it.file_name)} · ${fmt(it.start * it.interval)} – ${fmt((it.end + 1) * it.interval)} · ${dur(n * it.interval)}</span>
      <span class="spacer"></span>
      <div class="nav"><button id="rPrev" ${review.index === 0 ? "disabled" : ""}><kbd>←</kbd> Previous</button>
      <button id="rNext" ${review.index >= review.items.length - 1 ? "disabled" : ""}>Skip <kbd>→</kbd></button></div>
    </div>
    <div class="vs"><span class="who">You said</span>${pill(it.yours)}<span class="arrow">vs</span>
      <span class="who">Model thinks</span>${pill(it.model)}<span class="conf">${Math.round(100 * it.confidence)}% sure</span></div>
    <div class="frames" style="grid-template-columns:repeat(${Math.min(4, sampleOf(it.frames).length)}, 1fr)">${sampleOf(it.frames).map(i =>
      `<div class="frame" data-i="${i}" data-v="${it.video_id}"><img src="${frameUrl(i, it.video_id)}" alt=""><span class="t">${fmt(i * it.interval)}</span></div>`).join("")}</div>
    <p class="hint">The model never saw this stream while training, so it can't just repeat your labels — it's either wrong, or the label deserves a second look.
      <span class="model-status">${modelLine()}</span></p>
    ${payoff()}`;
  $("rPrev").onclick = () => { review.index--; renderReview(); };
  $("rNext").onclick = () => { review.index++; renderReview(); };
  $("dock").innerHTML = `
    <button class="lab keep" style="--c:var(--${it.yours})" data-act="keep"><span class="name"><span class="dot" style="background:var(--${it.yours})"></span>Keep ${BY_ID[it.yours].name}<kbd>K</kbd></span>
      <span class="def">Your label stays and won't be flagged again</span></button>
    <button class="lab keep" style="--c:var(--${it.model})" data-act="model"><span class="name"><span class="dot" style="background:var(--${it.model})"></span>Switch to ${BY_ID[it.model].name}<kbd>M</kbd></span>
      <span class="def">The model is right here</span></button>`
    + LABELS.filter(x => x.id !== it.yours && x.id !== it.model).map(x => `<button class="lab small" data-l="${x.id}" style="--c:var(--${x.id})">
      <span class="name"><span class="dot" style="background:var(--${x.id})"></span>${x.name}<kbd>${x.key}</kbd></span><span class="def">Neither — it's this</span></button>`).join("")
    + `<button class="lab tool" data-act="open"><span class="name">Open<kbd>O</kbd></span><span class="def">See it in the labeller</span></button>`;
  $("dock").querySelectorAll("[data-act=keep]").forEach(b => b.onclick = () => resolve(it.yours));
  $("dock").querySelectorAll("[data-act=model]").forEach(b => b.onclick = () => resolve(it.model));
  $("dock").querySelectorAll("[data-l]").forEach(b => b.onclick = () => resolve(b.dataset.l));
  $("dock").querySelector("[data-act=open]").onclick = () => openInLabeler(it);
  for (const next of review.items.slice(review.index + 1, review.index + 3))
    for (const i of sampleOf(next.frames)) new Image().src = frameUrl(i, next.video_id);
}
// The last decisions tell whether reviewing still pays off: a changed label means the model caught
// a real mistake, a kept one means it was wrong. Items come most-confident first, so once it is
// mostly wrong, the rest of the list will be too.
const WINDOW = 10, STOP_AT = 2;
let reviewLog = [];
try { reviewLog = JSON.parse(localStorage.getItem("reviewLog") || "[]"); } catch {}
function logDecision(changed) {
  reviewLog = [...reviewLog, changed].slice(-WINDOW);
  try { localStorage.setItem("reviewLog", JSON.stringify(reviewLog)); } catch {}
}
function payoff() {
  const changed = reviewLog.filter(Boolean).length, n = reviewLog.length;
  const dots = Array.from({ length: WINDOW }, (_, i) => {
    const d = reviewLog[i]; return `<span class="${d === undefined ? "" : d ? "changed" : "kept"}"></span>`; }).join("");
  let text, stop = false;
  if (n < WINDOW) text = `<b>Too early to tell.</b> After ${WINDOW} decisions this will say whether to keep going (${WINDOW - n} to go).`;
  else if (changed <= STOP_AT) { stop = true; text = `<b>You can stop here.</b> The model was wrong in ${n - changed} of your last ${n} decisions, and the rest of the list is less confident than these.`; }
  else text = `<b>Keep going.</b> The model caught a real mistake in ${changed} of your last ${n} decisions.`;
  return `<div class="payoff ${stop ? "stop" : ""}"><span class="q">Still worth reviewing?</span><div class="dots" title="Your last ${WINDOW} decisions">${dots}</div>
    <span class="text">${text}</span>
    <span class="legend"><span><i style="background:var(--tease)"></i>you changed the label</span><span><i style="background:#3a3d45"></i>you kept yours</span></span>
    ${stop ? `<button class="primary" id="stopReview">Back to labelling</button>` : ""}</div>`;
}
document.addEventListener("click", e => { if (e.target.id === "stopReview") setMode("label"); });

async function resolve(label) {
  const it = review.items[review.index]; if (!it) return;
  try {
    const r = await fetch("/api/labels", { method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify({ video_id: it.video_id, frames: it.frames, label, confirmed: true }) });
    if (!r.ok) throw new Error(r.status);
  } catch { toast("Couldn't save — is the label server still running?"); return; }
  if (label !== it.yours) {
    byLabel[it.yours] -= it.frames.length; byLabel[label] = (byLabel[label] || 0) + it.frames.length; renderOverall();
    if (rec && rec.id === it.video_id) it.frames.forEach(i => labels[i] = label);
  }
  logDecision(label !== it.yours);
  review.items.splice(review.index, 1); review.total--;
  $("reviewCount").textContent = review.total;
  renderReview();
}
async function openInLabeler(it) {
  setMode("label");
  if (!rec || rec.id !== it.video_id) await open(it.video_id);
  const k = scenes.findIndex(s => s[0] <= it.start && it.start <= s[1]);
  if (k >= 0) go(k);
}
function reviewKey(e) {
  const it = review.items[review.index];
  if (it && e.key === "k") resolve(it.yours);
  else if (it && e.key === "m") resolve(it.model);
  else if (it && BY_KEY[e.key]) resolve(BY_KEY[e.key]);
  else if (it && e.key === "o") openInLabeler(it);
  else if (e.key === "ArrowRight" && review.index < review.items.length - 1) { review.index++; renderReview(); }
  else if (e.key === "ArrowLeft" && review.index > 0) { review.index--; renderReview(); }
  else if (e.key === "r") openDrawer();
  else return;
  e.preventDefault();
}
function setMode(m) {
  mode = m;
  $("tabLabel").classList.toggle("on", m === "label"); $("tabReview").classList.toggle("on", m === "review");
  $("tlBlock").hidden = $("scene").hidden = m !== "label";
  $("review").hidden = m !== "review";
  $("picker").style.visibility = m === "label" ? "" : "hidden";
  try { history.replaceState(null, "", m === "review" ? "#review" : "#"); } catch {}
  if (m === "review") { renderReview(); loadReview(); } else if (rec) render();
  scrollTo({ top: 0 });
}
// Frames the model in Kura was trained on; `unsure` frames never count.
let exportedFrames;
function renderExportInfo() {
  if (exportedFrames === undefined) return;
  const usable = Object.entries(byLabel).filter(([l]) => l !== "unsure").reduce((a, [, n]) => a + n, 0);
  $("exportInfo").textContent = exportedFrames === null ? "never sent"
    : usable !== exportedFrames ? `${Math.abs(usable - exportedFrames).toLocaleString()} labels since last send` : "up to date";
}
async function loadExportInfo() {
  try {
    const { exported } = await (await fetch("/api/export")).json();
    exportedFrames = exported ? exported.labelled_frames : null;
    renderExportInfo();
  } catch {}
}
$("exportBtn").onclick = async () => {
  $("exportInfo").textContent = "training…"; $("exportBtn").disabled = true;
  try {
    const r = await fetch("/api/export", { method: "POST" });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const m = await r.json();
    toast(`Kura now finds highlights with a model trained on ${m.labelled_frames.toLocaleString()} frames. Use Find again on a recording to see it.`, "ok");
  } catch (e) { toast("Couldn't send the model: " + e.message); }
  $("exportBtn").disabled = false; loadExportInfo();
};
$("tabLabel").onclick = () => setMode("label");
$("tabReview").onclick = () => setMode("review");

loadList().then(() => {
  loadSuggestions(); loadReview(); loadExportInfo();
  if (location.hash === "#review") setMode("review");
  let last = null; try { last = +localStorage.getItem("lastRec"); } catch {}
  const start = recs.find(r => r.id === last) || recs.find(r => r.labeled < r.count) || recs[0];
  if (start) open(start.id);
});
</script>
</body>
</html>
