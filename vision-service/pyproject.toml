[project]
name = "vision-service"
version = "0.1.0"
description = "Generic visual inference microservice with pluggable detectors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "insightface>=0.7.3",
    "nudenet==3.4.2",
    "onnxruntime-migraphx>=1.23.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0,<2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[project.scripts]
vision-service = "vision_service.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_service"]

[tool.uv]
exclude-dependencies = [
    { package = { name = "nudenet", version = "3.4.2" }, dependencies = ["onnxruntime"] },
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
